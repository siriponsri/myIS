<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">R0 versus R0-W baseline retrieval</title>
  <desc id="desc">Two aligned pipelines compare one full TAC document per patent family with non-overlapping 512-token windows and family MaxP aggregation. BM25, evaluator, and top-k remain fixed.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 25px Arial, sans-serif; fill: #172033; }
      .panel-subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #172033; }
      .node-body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, sans-serif; fill: #64748b; }
      .metric-title { font: 700 19px Arial, sans-serif; fill: #172033; }
      .metric { font: 700 25px Arial, sans-serif; fill: #172033; }
      .caveat { font: 400 15px Arial, sans-serif; fill: #7c2d12; }
      .box { stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="80" y="65" class="title">R0 vs R0-W: representation is the only change</text>
  <text x="80" y="103" class="subtitle">Same BM25 retriever, evaluator, top-k=100, and family-level target. Only the document representation differs.</text>

  <rect x="60" y="145" width="700" height="570" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="840" y="145" width="700" height="570" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="60" y="145" width="700" height="88" rx="10" fill="#dbeafe"/>
  <rect x="840" y="145" width="700" height="88" rx="10" fill="#ffedd5"/>
  <text x="92" y="184" class="panel-title">R0 | Full TAC document</text>
  <text x="92" y="213" class="panel-subtitle">One family becomes one searchable document</text>
  <text x="872" y="184" class="panel-title">R0-W | Window + MaxP</text>
  <text x="872" y="213" class="panel-subtitle">Split text, then keep the best window score per family</text>

  <rect x="95" y="312" width="145" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="167" y="345" text-anchor="middle" class="node-title">Query</text>
  <text x="167" y="370" text-anchor="middle" class="node-body">TAC query</text>
  <line x1="240" y1="351" x2="306" y2="351" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="306" y="268" width="225" height="175" rx="8" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="418" y="305" text-anchor="middle" class="node-title">1 TAC document</text>
  <text x="418" y="340" text-anchor="middle" class="node-body">Title</text>
  <text x="418" y="367" text-anchor="middle" class="node-body">Abstract</text>
  <text x="418" y="394" text-anchor="middle" class="node-body">Claims</text>
  <text x="418" y="424" text-anchor="middle" class="small">per patent family</text>
  <line x1="531" y1="351" x2="590" y2="351" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="590" y="312" width="132" height="78" rx="8" fill="#f8fafc" stroke="#2563eb" class="box"/>
  <text x="656" y="345" text-anchor="middle" class="node-title">BM25</text>
  <text x="656" y="370" text-anchor="middle" class="node-body">rank</text>
  <line x1="656" y1="390" x2="656" y2="456" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="558" y="456" width="196" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="656" y="489" text-anchor="middle" class="node-title">Top 100 families</text>
  <text x="656" y="514" text-anchor="middle" class="small">family_first</text>
  <text x="95" y="620" class="small">Corpus count: 45,336 family documents</text>
  <text x="95" y="650" class="small">Simple baseline; no window aggregation</text>

  <rect x="875" y="312" width="145" height="78" rx="8" fill="#fff7ed" stroke="#d97706" class="box"/>
  <text x="947" y="345" text-anchor="middle" class="node-title">Query</text>
  <text x="947" y="370" text-anchor="middle" class="node-body">TAC query</text>
  <line x1="1020" y1="351" x2="1068" y2="351" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="1068" y="263" width="190" height="175" rx="8" fill="#fff7ed" stroke="#d97706" class="box"/>
  <text x="1163" y="299" text-anchor="middle" class="node-title">512-token windows</text>
  <rect x="1101" y="321" width="124" height="25" rx="4" fill="#fed7aa"/>
  <rect x="1101" y="352" width="124" height="25" rx="4" fill="#fdba74"/>
  <rect x="1101" y="383" width="124" height="25" rx="4" fill="#fb923c"/>
  <text x="1163" y="426" text-anchor="middle" class="small">non-overlapping</text>
  <line x1="1258" y1="351" x2="1305" y2="351" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="1305" y="312" width="105" height="78" rx="8" fill="#f8fafc" stroke="#d97706" class="box"/>
  <text x="1357" y="345" text-anchor="middle" class="node-title">BM25</text>
  <text x="1357" y="370" text-anchor="middle" class="node-body">each window</text>
  <line x1="1410" y1="351" x2="1448" y2="351" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="1448" y="312" width="70" height="78" rx="8" fill="#fff7ed" stroke="#d97706" class="box"/>
  <text x="1483" y="344" text-anchor="middle" class="node-title">MaxP</text>
  <text x="1483" y="370" text-anchor="middle" class="small">best</text>
  <line x1="1483" y1="390" x2="1483" y2="456" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="1382" y="456" width="136" height="74" rx="8" fill="#fff7ed" stroke="#d97706" class="box"/>
  <text x="1450" y="489" text-anchor="middle" class="node-title">Top 100</text>
  <text x="1450" y="514" text-anchor="middle" class="small">families</text>
  <text x="875" y="620" class="small">Corpus count: 127,019 windows</text>
  <text x="875" y="650" class="small">Family score = maximum window score</text>

  <rect x="60" y="742" width="1480" height="188" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="92" y="780" class="metric-title">Observed selection / OUT Recall@100 (development evidence)</text>
  <text x="92" y="815" class="small">Same evaluator and split. Higher is better. Final 872 was not used.</text>
  <text x="285" y="868" text-anchor="end" class="metric">R0 0.0624</text>
  <rect x="310" y="842" width="360" height="34" rx="5" fill="#bfdbfe"/>
  <text x="330" y="866" class="node-body">full document</text>
  <text x="1070" y="868" text-anchor="end" class="metric">R0-W 0.0747</text>
  <rect x="1095" y="842" width="430" height="34" rx="5" fill="#fed7aa"/>
  <text x="1115" y="866" class="node-body">window + MaxP</text>
  <text x="800" y="914" text-anchor="middle" class="caveat">Observed delta: +0.0123. Descriptive only; not a final or statistical-superiority claim.</text>
  <text x="800" y="954" text-anchor="middle" class="small">Design basis: DAPFAM [U011] and AutoIndex [U154]. The 512-token window is a myIS control choice.</text>
</svg>
