[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myis-research"
version = "0.1.0"
description = "Governed infrastructure for myIS publication research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema==4.25.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
]
tracking = [
    "mlflow==3.14.0",
    "waitress==3.0.2; sys_platform == 'win32'",
]
notebook = ["nbclient>=0.10", "nbformat>=5.10"]
p1 = ["pyarrow==24.0.0"]
test = [
    "httpx==0.28.1",
    "pytest>=8,<10",
]

[project.scripts]
myis-dashboard = "myis_research.dashboard.cli:main"
myis-assets = "myis_research.asset_cli:main"
myis-sessions = "myis_research.session_cli:main"
myis-report = "myis_research.report_cli:main"
myis-owner-local = "myis_research.owner_local_cli:main"
myis-p2 = "myis_research.p2_cli:main"
myis-legacy-dapfam = "myis_research.legacy_dapfam_cli:main"
myis-p1-dapfam = "myis_research.dapfam_p1_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
