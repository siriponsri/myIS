project:
  program_id: myis-research
  display_name: myIS Research
  protocol_version: "1.0"
  research_version: "0.1"
  track_research_version: "0.1"
  package_version: "0.1.0"
  version_class: protocol_major
  protocol_family_id: crossroute-frozen-c1-skillopt-v1
  legacy_aliases: [historical-program-label]
  repository: https://github.com/siriponsri/myIS.git
  status: implementation_active

authority:
  ask_owner_when_uncertain: true
  delete_requires_explicit_yes_no: true
  push_allowed: false
  brain_write_mode: serial_writer
  active_memory_layer: obsidian_brain

research:
  track_order: [C, S]
  phase_order: [F0, F1, D0, C0, C1, CF, S0, S1, SF, CT, Q, PC, PS]
  gate_order: [G0, G1, G2, G3, G4, G5, G6, G7, G8]
  active_path: [C, CF, S]
  shared_query_membership:
    seed: 42
    partitions: {train: 250, selection: 125, joint_test: 872}
    status: commitment_only_owner_freeze_required
  gate_c_primary_metric: OUT_Recall@100
  track_s_primary_metric: OUT_Recall@100
  track_c_ranking_diagnostic: frozen_pool_only_not_independent_gate
  selection_rule: strictly_greater_reject_ties
  mde_role: prospective_design_sensitivity_only
  confirmation_execution: external_owner_run_aggregate_only
  u041_u153_triage_authorized: true
  held_out_access: false

dependencies:
  python: "3.11"
  authority: pyproject.toml+uv.lock
  clean_replay: uv sync --locked

services:
  dashboard_bind: 127.0.0.1
  dashboard_artifacts_read_only: true
  owner_decision_ledger: 00_governance/approvals
  pdf_receipt_ledger: local_ignored_hash_chain
  mlflow_authority: rebuildable_mirror_only

execution_gates:
  paid_api_gpu_vast_requires_owner_approval: true
  confirmation_access_requires_owner_approval: true
  protected_memory_content_forbidden: true
  canonical_manifest_required: true
  mlflow_lineage_required: true
