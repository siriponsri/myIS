schema_version: myis.mlflow-mirror-config.v1
program_id: myis-research
display_name: myIS Research
protocol_version: "1.0"
research_version: "0.1"
authority: git-and-validated-artifacts
store_env: MYIS_MLFLOW_STORE
database_relative_path: database/mlflow.db
artifact_relative_path: artifacts
receipt_relative_path: receipts/mlflow
ignored_local_deferred_root: 04_outputs/artifacts/mlflow/deferred
writer:
  mode: serialized
  lock_relative_path: .mlflow-writer.lock
  sqlite_workers: 1
experiments:
  bootstrap: myis-research-bootstrap
  catalog: myis-research-catalog
  track_c: myis-research-track-c
  track_s: myis-research-track-s
  joint: myis-research-joint
  publication: myis-research-publication
allowlisted_kinds:
  catalog: [docs, rubrics, rules, tools, skills, environment]
  track_c: [results, metrics, environment]
  track_s: [results, metrics, environment]
  joint: [results, metrics, environment]
  publication: [docs, results, metrics, environment]
required_tags:
  - program_id
  - display_name
  - protocol_version
  - research_version
  - track
  - arm
  - phase
  - data_role
  - canonical_source_sha256
forbidden_content:
  - qrels
  - confirmation split membership
  - confirmation outcomes
  - per-query records
  - credentials
  - PDFs
  - raw provider payloads
upload_policy:
  files_must_be_explicit: true
  directory_uploads: false
  validated_required: true
  redacted_required: true
  sha256_required: true
recovery:
  mlflow_is_authoritative: false
  automatic_repair: false
  rebuild_from_git_and_validated_artifacts: true
