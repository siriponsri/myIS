<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Rebuildable MLflow mirror</title><desc id="desc">Validated canonical sources pass through explicit allowlisting, hashing, and redaction to a serialized local mirror that can be rebuilt without changing research truth.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M230 280H310"/><path d="M650 280H730"/></g>
    <rect x="40" y="155" width="190" height="250" rx="4" fill="#e7f3f1" stroke="#147d75"/><rect x="310" y="155" width="340" height="250" rx="4" fill="#fff" stroke="#b8c1c8"/><rect x="730" y="155" width="190" height="250" rx="4" fill="#fff" stroke="#b8c1c8"/>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="13" font-weight="700" fill="#147d75"><text x="135" y="190">CANONICAL</text><text x="480" y="190">SERIAL MIRROR WRITER</text><text x="825" y="190">MLFLOW</text></g>
    <g font-size="14" fill="#182126"><text x="135" y="235">Git documents</text><text x="135" y="262">Validated manifests</text><text x="135" y="289">Aggregate metrics</text><text x="135" y="316">Skills / rules / tools</text><text x="480" y="235">Explicit file allowlist</text><text x="480" y="262">Path + symlink checks</text><text x="480" y="289">SHA-256 verification</text><text x="480" y="316">Protected-key rejection</text><text x="480" y="343">Idempotent serialized write</text><text x="825" y="235">Searchable catalog</text><text x="825" y="262">Read-only viewer</text><text x="825" y="289">No canonical authority</text><text x="825" y="316">Rebuild from sources</text></g>
    <text x="480" y="470" font-size="14" fill="#b42318">Never mirror PDFs, qrels, membership, credentials, or protected per-query outcomes</text>
  </g>
</svg>
