<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Governed run lifecycle</title><desc id="desc">A run advances through created, preflighted, running, and succeeded states, with explicit failed, cancelled, and invalidated terminal paths.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M200 180H270"/><path d="M430 180H500"/><path d="M660 180H730"/><path d="M580 225V325"/><path d="M580 225L350 325"/><path d="M120 225V325"/></g>
    <g fill="#fff" stroke="#b8c1c8"><rect x="40" y="135" width="160" height="90" rx="4"/><rect x="270" y="135" width="160" height="90" rx="4"/><rect x="500" y="135" width="160" height="90" rx="4"/></g><rect x="730" y="135" width="160" height="90" rx="4" fill="#e7f3f1" stroke="#147d75"/>
    <g fill="#fbe9e7" stroke="#b42318"><rect x="40" y="325" width="160" height="90" rx="4"/><rect x="270" y="325" width="160" height="90" rx="4"/><rect x="500" y="325" width="160" height="90" rx="4"/></g>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="13" font-weight="700"><text x="120" y="175" fill="#147d75">CREATED</text><text x="350" y="175" fill="#147d75">PREFLIGHTED</text><text x="580" y="175" fill="#147d75">RUNNING</text><text x="810" y="175" fill="#147d75">SUCCEEDED</text><text x="120" y="365" fill="#b42318">INVALIDATED</text><text x="350" y="365" fill="#b42318">CANCELLED</text><text x="580" y="365" fill="#b42318">FAILED</text></g>
    <g font-size="14" fill="#5d6870"><text x="120" y="198">Typed run spec</text><text x="350" y="198">Checks pass</text><text x="580" y="198">Bounded execution</text><text x="810" y="198">Valid artifacts</text><text x="120" y="388">Contract breach</text><text x="350" y="388">Explicit stop</text><text x="580" y="388">Execution failure</text></g>
  </g>
</svg>
