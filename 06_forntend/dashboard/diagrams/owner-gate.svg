<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Owner Gate decision flow</title><desc id="desc">A typed scope is validated, previewed, explicitly confirmed, and appended as an immutable hash-chained record.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M180 280H240"/><path d="M400 280H460"/><path d="M620 280H680"/><path d="M840 280H900"/></g>
    <g fill="#fff" stroke="#b8c1c8"><rect x="20" y="205" width="160" height="150" rx="4"/><rect x="240" y="205" width="160" height="150" rx="4"/><rect x="460" y="205" width="160" height="150" rx="4"/><rect x="680" y="205" width="160" height="150" rx="4"/></g><rect x="900" y="250" width="40" height="60" rx="4" fill="#e7f3f1" stroke="#147d75"/>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#147d75"><text x="100" y="238">TYPED SCOPE</text><text x="320" y="238">VALIDATE</text><text x="540" y="238">PREVIEW</text><text x="760" y="238">CONFIRM</text></g>
    <g font-size="13" fill="#182126"><text x="100" y="275">Gate + action</text><text x="100" y="300">Phase / task / target</text><text x="100" y="325">Evidence + budget</text><text x="320" y="275">Backend actor</text><text x="320" y="300">Git + ledger head</text><text x="320" y="325">Scope SHA-256</text><text x="540" y="275">Exact immutable JSON</text><text x="540" y="300">Five-minute token</text><text x="540" y="325">No write yet</text><text x="760" y="275">Explicit Owner check</text><text x="760" y="300">Revalidate state</text><text x="760" y="325">Append once</text><text x="920" y="275" writing-mode="tb">LEDGER</text></g>
  </g>
</svg>
