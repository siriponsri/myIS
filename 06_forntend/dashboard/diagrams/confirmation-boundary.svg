<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">External confirmation boundary</title><desc id="desc">The repository emits hashes only; an Owner-run evaluator outside the agent workspace returns aggregate statistics without protected membership or outcomes.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <path d="M480 50V510" stroke="#b42318" stroke-width="2" stroke-dasharray="8 7"/><text x="480" y="34" text-anchor="middle" font-family="Cascadia Mono,Consolas,monospace" font-size="11" fill="#b42318">PROTECTED BOUNDARY</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="55" y="145" width="330" height="270" rx="4" fill="#fff" stroke="#147d75"/><rect x="575" y="145" width="330" height="270" rx="4" fill="#fbe9e7" stroke="#b42318"/>
    <text x="220" y="185" font-family="Cascadia Mono,Consolas,monospace" font-size="13" font-weight="700" fill="#147d75">AGENT WORKSPACE</text><text x="740" y="185" font-family="Cascadia Mono,Consolas,monospace" font-size="13" font-weight="700" fill="#b42318">OWNER-RUN EVALUATOR</text>
    <g font-size="14" fill="#182126"><text x="220" y="235">Frozen request</text><text x="220" y="268">Submission / config / protocol hashes</text><text x="220" y="318">Receives aggregate package only</text><text x="220" y="351">n, estimates, deltas, CI, effect, W/L/T</text><text x="740" y="235">Confirmation membership + qrels</text><text x="740" y="268">Protected payloads and per-query outcomes</text><text x="740" y="318">Protocol-matched baseline replay</text><text x="740" y="351">Schema-validated aggregate output</text></g>
    <path d="M385 245H455" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"/><path d="M575 335H505" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
