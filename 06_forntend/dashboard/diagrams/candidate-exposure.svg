<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Candidate exposure and frozen pool</title><desc id="desc">Grounded views feed bounded routes, a family-level ledger, a fixed candidate budget, and an immutable pool before ranking.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M190 280H270"/><path d="M430 280H510"/><path d="M670 280H750"/></g>
    <g fill="#fff" stroke="#b8c1c8"><rect x="30" y="190" width="160" height="180" rx="4"/><rect x="270" y="190" width="160" height="180" rx="4"/><rect x="510" y="190" width="160" height="180" rx="4"/></g><rect x="750" y="190" width="160" height="180" rx="4" fill="#e7f3f1" stroke="#147d75"/>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#147d75"><text x="110" y="225">GROUNDED VIEWS</text><text x="350" y="225">BOUNDED ROUTES</text><text x="590" y="225">FAMILY LEDGER</text><text x="830" y="225">FROZEN POOL</text></g>
    <g font-size="13" fill="#182126"><text x="110" y="265">Mechanism</text><text x="110" y="290">Function</text><text x="110" y="315">Structure</text><text x="110" y="340">Process / application</text><text x="350" y="265">Allowlisted kind</text><text x="350" y="290">Depth and quota</text><text x="350" y="315">Fixed final budget</text><text x="350" y="340">Fusion provenance</text><text x="590" y="265">Publication retained</text><text x="590" y="290">Family deduplicated</text><text x="590" y="315">Stable tie-break</text><text x="590" y="340">Batch-order invariant</text><text x="830" y="270">Write once</text><text x="830" y="300">Pool SHA-256</text><text x="830" y="330">No ranking expansion</text></g>
  </g>
</svg>
