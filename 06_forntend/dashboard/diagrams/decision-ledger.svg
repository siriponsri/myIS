<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Immutable decision ledger</title><desc id="desc">Each Owner Gate record contains its own digest-bound evidence and prior-record hash; a correction appends a superseding record rather than editing history.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M280 280H340"/><path d="M620 280H680"/></g>
    <g fill="#fff" stroke="#147d75"><rect x="40" y="150" width="240" height="260" rx="4"/><rect x="340" y="150" width="280" height="260" rx="4"/><rect x="680" y="150" width="240" height="260" rx="4"/></g>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#147d75"><text x="160" y="185">RECORD 001</text><text x="480" y="185">RECORD 002</text><text x="800" y="185">CORRECTION 003</text></g>
    <g font-size="13" fill="#182126"><text x="160" y="230">decision_id</text><text x="160" y="255">gate + status + rationale</text><text x="160" y="280">actor + timestamp</text><text x="160" y="305">evidence + Git + scope</text><text x="160" y="340">prior = null</text><text x="480" y="230">new decision_id</text><text x="480" y="255">never overwrites 001</text><text x="480" y="305">prior = SHA-256(001)</text><text x="800" y="230">new decision_id</text><text x="800" y="255">supersedes = 001</text><text x="800" y="305">prior = SHA-256(002)</text></g>
    <text x="480" y="470" font-size="13" fill="#9a6700">Append-only and tamper-evident | chain verification fails closed</text>
  </g>
</svg>
