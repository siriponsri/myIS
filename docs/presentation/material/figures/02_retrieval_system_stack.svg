<path d="M 318 422 L 334 432 L 318 442" fill="none" stroke="#007f7b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="600" y1="432" x2="624" y2="432" stroke="#007f7b" stroke-width="4" stroke-linecap="round"/>
