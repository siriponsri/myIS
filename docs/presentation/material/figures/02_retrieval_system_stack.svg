<rect x="160" y="630" width="1280" height="110" rx="10" fill="#ffffff" stroke="#d5dcde" stroke-width="2"/>
<text x="200" y="678" class="b t" text-anchor="start">Design rule</text>
<text x="430" y="670" class="s m" text-anchor="start">A1 compares five programs across five arms. A2 searches frozen candidates per arm.</text>
<text x="430" y="698" class="s m" text-anchor="start">A3 tests transfer and complementarity only after A2 closes.</text>
<text x="800" y="812" class="b t" text-anchor="middle">No LLM is required in the synchronous production retrieval path.</text>
