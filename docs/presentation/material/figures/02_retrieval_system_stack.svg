<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0} .t{fill:#18232b} .m{fill:#5d6b73} .s{font-size:22px} .b{font-size:30px;font-weight:700} .h{font-size:42px;font-weight:700} .k{font-size:18px;font-weight:700;letter-spacing:1.5px}</style>
<rect width="1600" height="900" fill="#f7f8f7"/>
<text x="90" y="80" class="k" text-anchor="start">RETRIEVAL SYSTEM</text>
<text x="90" y="145" class="h t" text-anchor="start">Representation connects patent fields to a frozen retriever</text>
<text x="90" y="188" class="s m" text-anchor="start">ArmIndex varies the document representation while keeping evaluation, model adapters, and metrics controlled.</text>
<line x1="90" y1="220" x2="1510" y2="220" stroke="#ccd5d8" stroke-width="2" stroke-linecap="round"/>
<rect x="90" y="350" width="210" height="165" rx="10" fill="#e0f0ee" stroke="#cbd5d7" stroke-width="2"/>
<text x="195.0" y="405" class="b t" text-anchor="middle">Patent family</text>
<text x="195.0" y="445" class="s m" text-anchor="middle">title</text>
<text x="195.0" y="473" class="s m" text-anchor="middle">abstract</text>
<text x="195.0" y="501" class="s m" text-anchor="middle">claims</text>
<rect x="350" y="350" width="240" height="165" rx="10" fill="#e4edf8" stroke="#cbd5d7" stroke-width="2"/>
<text x="470.0" y="405" class="b t" text-anchor="middle">Representation</text>
<text x="470.0" y="445" class="s m" text-anchor="middle">document</text>
<text x="470.0" y="473" class="s m" text-anchor="middle">claim</text>
<text x="470.0" y="501" class="s m" text-anchor="middle">passages</text>
<text x="470.0" y="529" class="s m" text-anchor="middle">three views</text>
<rect x="640" y="350" width="220" height="165" rx="10" fill="#fbefd8" stroke="#cbd5d7" stroke-width="2"/>
<text x="750.0" y="405" class="b t" text-anchor="middle">Retriever arm</text>
<text x="750.0" y="445" class="s m" text-anchor="middle">BM25 or</text>
<text x="750.0" y="473" class="s m" text-anchor="middle">dense embedding</text>
<text x="750.0" y="501" class="s m" text-anchor="middle">fixed adapter</text>
<rect x="910" y="350" width="220" height="165" rx="10" fill="#f8e6e8" stroke="#cbd5d7" stroke-width="2"/>
<text x="1020.0" y="405" class="b t" text-anchor="middle">Family ranking</text>
<text x="1020.0" y="445" class="s m" text-anchor="middle">MaxP or</text>
<text x="1020.0" y="473" class="s m" text-anchor="middle">view RRF</text>
<text x="1020.0" y="501" class="s m" text-anchor="middle">top 100</text>
<rect x="1180" y="350" width="260" height="165" rx="10" fill="#e6efe8" stroke="#cbd5d7" stroke-width="2"/>
<text x="1310.0" y="405" class="b t" text-anchor="middle">Evaluation</text>
<text x="1310.0" y="445" class="s m" text-anchor="middle">OUT Recall@100</text>
<text x="1310.0" y="473" class="s m" text-anchor="middle">nDCG@100</text>
<text x="1310.0" y="501" class="s m" text-anchor="middle">latency and cost</text>
