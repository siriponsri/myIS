<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Retriever-conditioned patent retrieval pipeline</title>
  <desc id="desc">Pipeline from patent text through representation programs, fixed retriever arms, indexing, family aggregation, and aggregate evaluation.</desc>
  <style>.bg{fill:#fbfcfd}.title{font:700 44px Arial,sans-serif;fill:#17212b}.sub{font:400 22px Arial,sans-serif;fill:#485764}.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:400 19px Arial,sans-serif;fill:#26333d}.small{font:400 17px Arial,sans-serif;fill:#485764}.box{stroke-width:3}.arrow{stroke:#49616f;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#49616f"/></marker></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="70" y="80" class="title">A retrieval system is more than an embedding model</text>
  <text x="70" y="118" class="sub">ArmIndex holds the evaluator fixed and asks which representation program is best for each frozen retriever.</text>
  <rect x="65" y="240" width="255" height="300" rx="8" fill="#e9f1f5" stroke="#35637a" class="box"/>
  <text x="92" y="290" class="h">1. Patent source</text><text x="92" y="335" class="t">Title</text><text x="92" y="372" class="t">Abstract</text><text x="92" y="409" class="t">Claims</text><text x="92" y="470" class="small">Query and corpus views</text>
  <path d="M325 390 H405" class="arrow"/>
  <rect x="420" y="160" width="330" height="460" rx="8" fill="#eef4e7" stroke="#54743b" class="box"/>
  <text x="450" y="210" class="h">2. Representation program</text><text x="450" y="260" class="t">Full title + abstract + claims</text><text x="450" y="310" class="t">Title + abstract</text><text x="450" y="360" class="t">First-claim segment</text><text x="450" y="410" class="t">Fixed passages</text><text x="450" y="460" class="t">Title / abstract / claims views</text><text x="450" y="540" class="small">Deterministic transformation</text><text x="450" y="570" class="small">No model-weight adaptation</text>
  <path d="M755 390 H835" class="arrow"/>
  <rect x="850" y="135" width="340" height="510" rx="8" fill="#f8eee4" stroke="#9b622d" class="box"/>
  <text x="880" y="185" class="h">3. Frozen retriever arm</text><text x="880" y="237" class="t">ARM-01: BM25 lexical</text><text x="880" y="287" class="t">ARM-02: BGE-M3</text><text x="880" y="337" class="t">ARM-03: PatEmbed</text><text x="880" y="387" class="t">ARM-04: Arctic Embed</text><text x="880" y="437" class="t">ARM-05: Qwen3 Embedding</text><text x="880" y="515" class="small">Each arm fixes prompting, pooling,</text><text x="880" y="543" class="small">normalization, length, and software.</text>
  <path d="M1195 390 H1275" class="arrow"/>
  <rect x="1290" y="240" width="245" height="300" rx="8" fill="#f1edf6" stroke="#684b83" class="box"/>
  <text x="1318" y="290" class="h">4. Evaluate</text><text x="1318" y="335" class="t">Index and search</text><text x="1318" y="372" class="t">Aggregate to family</text><text x="1318" y="409" class="t">OUT Recall@100</text><text x="1318" y="470" class="small">Quality + latency + cost</text>
  <text x="70" y="760" class="h">Central question</text><text x="70" y="804" class="t">Does the best document representation depend on the retriever, rather than transferring universally across lexical and dense models?</text>
  <text x="70" y="855" class="small">Design rationale: AutoIndex motivates executable representation search; DAPFAM motivates family-level OUT evaluation; frozen adapters preserve comparability.</text>
</svg>
