<text x="800" y="810" class="s t" text-anchor="middle">A3 gates: valid A2 coverage, 3 primary receipts, 2 diagnostic exclusions, safe return, and independent audit.</text>
<text x="800" y="838" class="s t" text-anchor="middle">Fresh Train-250 package, provider quote, and USD 35 cap are required.</text>
