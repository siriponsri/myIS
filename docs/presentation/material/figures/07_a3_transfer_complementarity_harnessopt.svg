<text x="800" y="575" class="b t" text-anchor="start">2. Bounded HarnessOpt</text>
<text x="800" y="620" class="s m" text-anchor="start">At most 3 complete batches x 4 fixed roles:</text>
<text x="800" y="655" class="s m" text-anchor="start">quality exploit | cost/latency ablation</text>
