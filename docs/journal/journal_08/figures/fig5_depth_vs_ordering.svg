<line x1="30" y1="345" x2="1010" y2="345" stroke="#E6EBF0" stroke-width="1"/>
<text x="30" y="366" font-size="10" fill="#536271">Deepening the pool buys several times more Recall@100 than perfectly reordering a shallow one — and leaves most of the evidence unseen.</text>
