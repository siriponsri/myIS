<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Helvetica, Arial, sans-serif">
<text x="30" y="30" font-size="15" font-weight="bold" fill="#17212B">Candidate pool depth versus perfect ordering</text>
