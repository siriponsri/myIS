campaign:
  id: scope-autoindex-v1
  title: Learning Grounded Evidence Compilers for Cross-Domain Patent Retrieval
  status: P1_CPU_MEASURED_COMPLETE
  p2_status: ready_planned_not_measured
  p2_campaign_revision: scope-autoindex-v1-p2-r1-primary-v1
  p2_budget_profile_ref: control/budgets/p2-r1-primary-v1.yaml
  venue_target: isai-nlp-2026
  standing_authorization: D1_START_CAMPAIGN
  active_owner_decisions: [D2_OPEN_FINAL, D3_SUBMIT_RELEASE]

protocol:
  dataset_id: dapfam
  evaluation_unit: family
  query_view: tac
  corpus_view: full
  top_k: 100
  primary_metric: recall_at_100/out
  split_seed: 42
  split_roles:
    train: 250
    selection: 125
    final: 872
  selection_rule: strictly_greater_reject_ties
  p2_metric_role: train_selection_development_only
  p2_final_split_open: false

arms:
  - id: R0
    method: flat_bm25
    role: primary_baseline
  - id: R0-W
    method: deterministic_window_maxp
    role: efficiency_control
  - id: R1
    method: patent_native_autoindex_scope
    role: primary_method
    compiler_frozen: true
    max_searchable_units_per_family: adapter_specific_dapfam_limit

phases:
  - id: P0_FOUNDATION
    status: complete
    tasks:
      - id: P0.1
        title: Deterministic kernel and schema contracts
        status: complete
      - id: P0.2
        title: Integrity preflight and protected boundary
        status: complete
      - id: P0.3
        title: Projection contracts and migration closure
        status: complete
  - id: P1_CPU_BASELINE
    status: complete
    tasks:
      - id: P1.1
        title: R0 flat BM25 measured CPU baseline
        status: complete
      - id: P1.2
        title: R0-W window MaxP measured CPU baseline
        status: complete
      - id: P1.3
        title: Protected owner-local CPU evidence import
        status: complete
  - id: P2_SCOPE_DEVELOPMENT
    status: planned
    tasks:
      - id: P2.1
        title: R1 SCOPE/AutoIndex development
        status: planned
        budget_profile_id: p2-r1-primary-v1
        execution_envelope_ref: control/execution-envelope-p2.yaml
        measured_runs: 0
        selection_accesses: 0
        freeze_barrier: required
  - id: P3_FINAL
    status: locked_until_D2
    tasks:
      - id: P3.1
        title: Frozen final evaluation
        status: locked_owner_D2
  - id: P4_PUBLICATION
    status: locked_until_D3
    tasks:
      - id: P4.1
        title: Manuscript and release package
        status: locked_owner_D3

transfer:
  required:
    - fine_patents_zero_retuning
  optional:
    - patenteb_zero_retuning
    - dense_or_hybrid

conditional_extensions:
  skillopt:
    default: disabled
    admission:
      - frozen_structure_leverage
      - ranking_headroom
      - frozen_representation_and_retriever
      - equal_budget_simple_search_control
      - core_publication_safe

budget:
  currency: USD
  preferred_total: 100
  hard_stop: 100
  cpu_first: true
  provider_fallback: false

p2_execution:
  profile_id: p2-r1-primary-v1
  profile_ref: control/budgets/p2-r1-primary-v1.yaml
  candidate_allocation:
    frozen_controls: 4
    preregistered_patent_candidates: 8
    max_adaptive_candidates: 20
    max_candidates_total: 32
  runtime:
    max_wall_clock_seconds: 259200
    per_candidate_timeout_seconds: 10800
  stopping:
    max_adaptive_iterations: 5
    candidates_per_iteration: 4
    min_iterations_before_early_stop: 4
    no_improvement_patience: 2
    ties: reject
  freeze_barrier:
    one_scientific_run: true
    selection_exposure_limit: 1
    max_selection_finalists: 4
    freeze_receipt_required: true
    mutation_after_selection: forbidden
  budget_change_policy: new_campaign_revision_after_first_measured_run
