phases:
  - id: A0_MIGRATION_FOUNDATION
    purpose: Migrate repository, freeze contracts, preserve evidence, and run compute-feasibility fixtures.
    status: complete
    measured_retrieval: false
    tasks:
      - {id: A0.1, title: Repository and evidence migration, status: complete}
      - {id: A0.2, title: Canonical authority and professional documentation, status: complete}
      - {id: A0.3, title: "Brain, read-model, and Obsidian migration", status: complete}
      - {id: A0.4, title: MLflow and Dashboard migration, status: complete}
      - {id: A0.5, title: "Phase, Research Flow, and Owner-gate migration", status: complete}
      - {id: A0.6, title: Scientific contracts and schemas, status: complete}
      - {id: A0.7, title: Model and arm declarations and license registry, status: complete}
      - {id: A0.8, title: Compute and storage feasibility fixtures, status: complete}
      - {id: A0.9, title: "Validation, safety, and closeout", status: complete}
      - {id: A0.10, title: Legacy code harvest and phase-ready scaffolding, status: complete}
  - id: A1_BASELINES_AND_MULTI_ARM_SCREENING
    purpose: Reproduce controls and screen the five adapters with common programs.
    status: complete
    measured_retrieval: true
    tasks: [{id: A1.1, title: Adapter fixture validation, status: complete}, {id: A1.2, title: Common multi-arm screen, status: complete}]
  - id: A2_PER_ARM_AUTOINDEX
    purpose: Search and freeze one representation program per promoted arm.
    status: complete
    measured_retrieval: true
    tasks: [{id: A2.1, title: Per-arm AutoIndex, status: complete}]
  - id: A3_TRANSFER_COMPLEMENTARITY_AND_HARNESSOPT
    purpose: Analyze transfer, complementarity, and production-constrained harnesses.
    status: complete
    measured_retrieval: true
    tasks: [{id: A3.1, title: Cross-arm transfer matrix, status: complete}, {id: A3.2, title: Complementarity and HarnessOpt, status: complete}]
  - id: A4_PRODUCTION_TRANSFER_AND_SELECTION
    purpose: Freeze FAST/BALANCED/DEEP profiles and expose Selection once.
    status: complete
    measured_retrieval: true
    selection_exposure_limit: 1
    tasks: [{id: A4.1, title: Production profiles and legal transfer, status: complete}]
  - id: A5_FINAL_CONFIRMATION
    purpose: Run one frozen confirmation only after D2_OPEN_FINAL.
    status: complete
    measured_retrieval: true
    tasks: [{id: A5.1, title: Frozen final evaluation, status: complete}]
  - id: A6_FULL_DAPFAM_MATERIALIZATION_AND_SCALABILITY
    purpose: Generate the deterministic Top-200 family pool with the A5-frozen ARM-03 winner over full DAPFAM, then calculate Owner-local ALL/IN/OUT metrics and operational scalability evidence.
    status: complete
    measured_retrieval: true
    full_corpus_owner_local_only: true
    pool_depth: 200
    tasks: [{id: A6.1, title: Frozen ARM-03 full-DAPFAM candidate generation, evaluation, and safe return, status: complete}]
  - id: A7_SEVEN_LAYER_RETRIEVAL_DIAGNOSIS
    purpose: Apply the seven-layer retrieval diagnosis and comparison framework to immutable A6 evidence, including metric identity, family integrity, protocol parity, mechanism, rescue, exposure anatomy, and retrieval boundary.
    status: complete
    measured_retrieval: false
    tasks: [{id: A7.1, title: Seven-layer retrieval diagnosis and comparison, status: complete}]
  - id: A8_JOURNAL_SYNTHESIS_AND_PUBLICATION
    purpose: Build publication artifacts from validated aggregate-safe A0-A7 evidence only after D3_SUBMIT_RELEASE.
    status: locked_owner_D3
    measured_retrieval: false
    tasks: [{id: A8.1, title: Journal synthesis and submission package, status: locked_owner_D3}]

gates:
  owner: [D2_OPEN_FINAL, D3_SUBMIT_RELEASE]
  automatic: [repository_integrity, protected_data, model_lock, budget, arm_promotion, transfer_validity, harnessopt_stop, production_pareto, shortlist_freeze, one_shot_selection]
  selection_accesses: 1
  final_accesses: 1

budget:
  profile_id: armindex-migration-v2
  currency: USD
  migration_cost_actual_usd: 0
  hard_stop_usd: 180
  cpu_only: false
  paid_api: false
  gpu_scientific_run: true
  a1_2_planning_rate_usd_per_four_gpu_instance_hour: 0.6
  a1_2_estimated_instance_hours: 2-4
  a1_2_estimated_raw_worker_usd: 1.20-2.40
