schema_version: myis.reusable-assets.v2
authority: 01_Research/control/assets/reusable_assets.yaml
source_repositories:
  app:
    root_hint: ../00_App
    remote: https://github.com/siriponsri/thaipha-lex.git
    disposition: pointer_only
assets:
  - asset_id: APP-DAPFAM-PROTECTED
    title: DAPFAM protected corpus and evaluator inputs
    kind: protected_dataset
    disposition: reuse
    copy_mode: pointer
    allowed_phases: [P0_FOUNDATION, P1_CPU_BASELINE, P2_SCOPE_DEVELOPMENT]
    allowed_arms: [R0, R0-W, R1]
    protected_data_level: owner_local_only
    allowed_use: owner-local integrity, retrieval, and aggregate evaluation
    forbidden_use: copy qrels, membership, query IDs, or per-query outcomes into Git, Brain, MLflow, Dashboard, or Paper
    upstream_huggingface:
      dataset_id: datalyes/DAPFAM_patent
      dataset_url: https://huggingface.co/datasets/datalyes/DAPFAM_patent
      revision: a59a74ce31384165065af1823a83c6f94ccafd48
      license: CC-BY-NC-SA-4.0
      configs: [corpus, queries, relations]
      metadata_only: true
      live_fetch_allowed: false
    source_contract: control/assets/dapfam-p1-source.v1.json
  - asset_id: APP-DAPFAM-TEXT-PRIMITIVES
    title: DAPFAM text composition primitives
    kind: source_code
    disposition: adapt
    copy_mode: preport
    allowed_phases: [P0_FOUNDATION, P1_CPU_BASELINE]
    allowed_arms: [R0, R0-W]
    protected_data_level: none
    allowed_use: deterministic fixture and owner-local text rendering
  - asset_id: APP-SPARSE-FTS-INDEXES
    title: Existing sparse FTS indexes
    kind: retrieval_index
    disposition: reference_only
    copy_mode: pointer
    allowed_phases: [P1_CPU_BASELINE]
    allowed_arms: [R0, R0-W]
    protected_data_level: protected
    allowed_use: read-only schema and corpus-hash compatibility checks
  - asset_id: LIT-AUTOINDEX-U154
    title: AutoIndex paper and digest
    kind: literature
    disposition: reuse
    copy_mode: pointer
    allowed_phases: [P0_FOUNDATION, P2_SCOPE_DEVELOPMENT, P4_PUBLICATION]
    allowed_arms: [R1]
    protected_data_level: none
    canonical_path: evidence/literature/source/U154_autoindex_learning_representation_programs_for_retrieval.pdf
    digest_path: evidence/literature/digests/U154_autoindex_learning_representation_programs_for_retrieval_digest.md
  - asset_id: BRAIN-CURATED-MEMORY
    title: Curated Brain memory pointers
    kind: memory_projection
    disposition: adapt
    copy_mode: pointer
    allowed_phases: [P0_FOUNDATION, P1_CPU_BASELINE, P2_SCOPE_DEVELOPMENT, P3_FINAL, P4_PUBLICATION]
    protected_data_level: no_protected_payloads
    allowed_use: decisions, evidence pointers, lessons, failed attempts, active context
    forbidden_use: overriding canonical run facts or copying metrics into manually edited notes
