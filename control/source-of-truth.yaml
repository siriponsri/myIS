schema_version: myis.source-of-truth.v2
active_control_plane: 01_Research
projection_contract: projections/read-model/read-model.v2.json
records:
  - id: active_armindex_program
    authority: control/program.yaml
    active_campaign: campaigns/armindex-multiretriever-v2
    projections: [dashboard, brain, obsidian, paper, mlflow]
    restrictions: [migration_only, measured_counters_zero, selection_closed, final_closed]
  - id: armindex_protocol
    authority: control/campaigns/armindex-multiretriever-v2.yaml
    projections: [projections/read-model, dashboard, brain, paper, mlflow]
    restrictions: [synthetic_fixtures_only_during_migration, no_model_download]
  - id: armindex_a0_10_goal_amendment
    authority: control/migrations/armindex-a0.10-amendment.v1.yaml
    projections: [projections/read-model, dashboard, brain, obsidian, paper, mlflow]
    restrictions: [engineering_fixture_only, no_protected_data, measured_counters_zero]
  - id: armindex_a1_1_adapter_fixture_closeout
    authority: campaigns/armindex-multiretriever-v2/evidence/a1.1-adapter-fixture-validation.receipt.v1.json
    projections: [projections/read-model, dashboard, brain, obsidian, paper, mlflow]
    restrictions: [engineering_fixture_only, arm01_cpu_fixture_backend_only, dense_arms_fail_closed, no_protected_data, measured_counters_zero, gpu_proposal_non_authorizing]
  - id: phase_task_reporting_contract
    authority: [docs/observatory/REPORTING_POLICY.md, schemas/phase-task-report.v1.json]
    projections: [projections/reports, obsidian]
    restrictions: [detailed_english, fifteen_sections, owner_notes_preserved, archive_only_when_superseded_and_unreferenced]
  - id: control
    authority: control/program.yaml
    projections: [dashboard, brain, paper, mlflow]
  - id: protocol
    authority: control/campaigns/scope-autoindex-v1.yaml
    projections: [campaigns, dashboard, paper]
    status: historical_read_only
  - id: execution_boundary
    authority: [control/execution-envelope.yaml, control/execution-envelope-p2.yaml, control/execution-envelope-p2-v2.yaml]
    phase_mapping:
      P0_FOUNDATION: control/execution-envelope.yaml
      P1_CPU_BASELINE: control/execution-envelope.yaml
      P2_SCOPE_DEVELOPMENT: control/execution-envelope-p2-v2.yaml
      P3_FINAL: control/execution-envelope.yaml
      P4_PUBLICATION: control/execution-envelope.yaml
    projections: [harness, dashboard, mlflow, brain]
  - id: p2_budget_profile
    authority: control/budgets/p2-r1-primary-v2.yaml
    projections: [harness, dashboard, mlflow, brain, paper]
  - id: p2_campaign_revision
    authority: control/campaigns/scope-autoindex-p2-r1-primary-v2.yaml
    projections: [harness, projections/read-model, dashboard, mlflow, brain, paper]
  - id: p2_readiness_records
    authority: [campaigns/scope-autoindex-v1/proposals, campaigns/scope-autoindex-v1/preflight]
    projections: [harness, projections/read-model, dashboard, brain, paper]
    restrictions: [proposal_is_not_adoption, preflight_is_not_measured_execution, aggregate_hash_count_only]
  - id: schemas_and_kernel
    authority: [schemas, schemas/armindex, src/myis_research/kernel, src/myis_research/scope, src/myis_research/armindex]
    projections: [harness, mlflow, reports]
  - id: raw_and_protected_bytes
    authority: MYIS_STORE
    projections: [hash_only]
  - id: dapfam_p1_source_protocol
    authority: control/assets/dapfam-p1-source.v1.json
    projections: [harness, manifests, dashboard, brain, paper]
  - id: run_facts
    authority: [campaigns/scope-autoindex-v1/requests, campaigns/scope-autoindex-v1/evidence, campaigns/scope-autoindex-v1/manifests, campaigns/scope-autoindex-v1/validation-reports, campaigns/scope-autoindex-v1/packages, MYIS_STORE]
    projections: [mlflow, projections/read-model, dashboard, brain, paper]
  - id: owner_decisions
    authority: [control/decisions/D1_START_CAMPAIGN.yaml, control/decisions/ledger.jsonl]
    projections: [dashboard, brain, paper]
    allowed_ids: [D1_START_CAMPAIGN, D2_OPEN_FINAL, D3_SUBMIT_RELEASE]
  - id: human_memory
    authority: 02_Brain/memory
    projections: [qmd, obsidian]
    restrictions: [cannot_override_run_facts, cannot_store_protected_payloads]
  - id: publication_prose
    authority: 03_Paper/publications/isai-nlp-2026/manuscript
    projections: [release_pdf]
    restrictions: [numbers_must_resolve_to_run_facts]
