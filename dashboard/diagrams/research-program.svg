<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 310" role="img" aria-labelledby="title desc">
  <title id="title">myIS Research P0 to P4 program</title>
  <desc id="desc">The canonical flow from foundation through CPU baseline and SCOPE development to final evaluation and publication, with D2 and D3 as the only owner decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f6b68"/></marker>
  </defs>
  <rect width="1280" height="310" fill="#f3f7f6"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" fill="#203033">
    <text x="48" y="42" font-size="24" font-weight="700">myIS Research execution flow</text>
    <text x="48" y="68" font-size="14" fill="#5a6b6e">One canonical read model → MLflow, Obsidian, Dashboard, Paper projections</text>
    <g stroke="#0f6b68" stroke-width="3" marker-end="url(#arrow)">
      <path d="M230 165 H278"/><path d="M470 165 H518"/><path d="M710 165 H758"/><path d="M950 165 H998"/>
    </g>
    <g>
      <rect x="48" y="105" width="180" height="120" rx="8" fill="#dcefee" stroke="#0f6b68"/>
      <rect x="288" y="105" width="180" height="120" rx="8" fill="#e2f1e7" stroke="#2f7a4f"/>
      <rect x="528" y="105" width="180" height="120" rx="8" fill="#fff0d2" stroke="#a45d0a"/>
      <rect x="768" y="105" width="180" height="120" rx="8" fill="#e9e5fb" stroke="#6250a4"/>
      <rect x="1008" y="105" width="180" height="120" rx="8" fill="#f9e3e3" stroke="#b23a3a"/>
    </g>
    <g font-size="16" font-weight="700">
      <text x="72" y="140">P0_FOUNDATION</text><text x="312" y="140">P1_CPU_BASELINE</text><text x="552" y="140">P2_SCOPE_DEVELOPMENT</text><text x="792" y="140">P3_FINAL</text><text x="1032" y="140">P4_PUBLICATION</text>
    </g>
    <g font-size="13" fill="#5a6b6e">
      <text x="72" y="168">schemas + kernel</text><text x="72" y="190">protected boundary</text>
      <text x="312" y="168">R0 / R0-W</text><text x="312" y="190">CPU fixtures first</text>
      <text x="552" y="168">R1 AutoIndex/SCOPE</text><text x="552" y="190">SkillOpt conditional</text>
      <text x="792" y="168">one frozen split</text><text x="792" y="190">D2_OPEN_FINAL</text>
      <text x="1032" y="168">paper + release</text><text x="1032" y="190">D3_SUBMIT_RELEASE</text>
    </g>
    <text x="48" y="270" font-size="13" fill="#5a6b6e">Owner decisions are standing records; routine task defaults are automatic and no micro-gates are created.</text>
  </g>
</svg>
