<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic harness kernel</title><desc id="desc">Owner authority and typed policy proposals enter the deterministic kernel, which controls adapters, tools, evaluation, manifests, and projections.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a949b"/></marker></defs><rect width="960" height="560" fill="#f7f8fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="335" y="185" width="290" height="190" rx="4" fill="#e7f3f1" stroke="#147d75" stroke-width="2"/><text x="480" y="220" font-family="Cascadia Mono,Consolas,monospace" font-size="14" font-weight="700" fill="#147d75">DETERMINISTIC KERNEL</text>
    <g font-size="14" fill="#182126"><text x="480" y="255">Schemas | identity | approvals | budgets</text><text x="480" y="282">Splits | hashes | family dedup | tie-breaks</text><text x="480" y="309">Metrics | statistics | protected surfaces</text><text x="480" y="336">Immutable writes | redaction | validation</text></g>
    <g fill="#fff" stroke="#b8c1c8"><rect x="55" y="105" width="190" height="90" rx="4"/><rect x="55" y="365" width="190" height="90" rx="4"/><rect x="715" y="105" width="190" height="90" rx="4"/><rect x="715" y="235" width="190" height="90" rx="4"/><rect x="715" y="365" width="190" height="90" rx="4"/></g>
    <g font-family="Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#147d75"><text x="150" y="137">OWNER</text><text x="150" y="397">POLICY</text><text x="810" y="137">ADAPTERS</text><text x="810" y="267">EVALUATOR</text><text x="810" y="397">PROJECTIONS</text></g>
    <g font-size="14" fill="#182126"><text x="150" y="165">Approves named scope</text><text x="150" y="425">Proposes within limits</text><text x="810" y="165">Read-only first</text><text x="810" y="295">Frozen contracts</text><text x="810" y="425">Dashboard / MLflow</text></g>
    <g fill="none" stroke="#8a949b" stroke-width="2" marker-end="url(#a)"><path d="M245 150L335 220"/><path d="M245 410L335 340"/><path d="M625 220L715 150"/><path d="M625 280H715"/><path d="M625 340L715 410"/></g>
  </g>
</svg>
